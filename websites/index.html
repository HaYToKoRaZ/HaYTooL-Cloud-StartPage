<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaYTooL Cloud StartPage</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top, #1e293b, #0f172a);
        }
        .hero {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            background: -webkit-linear-gradient(45deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 20px auto;
        }
        .btn {
            display: inline-block;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 20px;
        }
        .btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>HaYTooL Cloud</h1>
        <p>Gelişmiş, özelleştirilebilir ve bulut senkronizasyonlu başlangıç sayfanız. Eklentiyi kurun ve tarayıcınızı bir sonraki seviyeye taşıyın.</p>
        <a href="https://github.com/HaYToKoRaZ/haytokoraz.github.io" class="btn">GitHub'da İncele</a>
    </div>
</body>
</html>
