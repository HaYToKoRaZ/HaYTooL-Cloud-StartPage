<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Girişi - HaYTooL</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { text-align: center; background: rgba(30,41,59,0.7); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); max-width: 340px; width: 90%; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px auto; display: none; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
        h2 { margin: 0 0 10px 0; font-weight: 500; font-size: 1.2rem; }
        p { color: #94a3b8; font-size: 14px; margin: 0 0 20px 0; }
        button { background: #24292e; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; cursor: pointer; transition: background 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        button:hover { background: #1b1f23; }
        .error { color: #ef4444; font-size: 12px; margin-top: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader" id="loader"></div>
        <h2 id="statusTitle">Eklenti Doğrulaması</h2>
        <p id="statusDesc">GitHub hesabınızla giriş yapın.</p>
        <button id="btnAuth">
            <span style="font-size:1.2rem">🐙</span> GitHub ile Giriş Yap
        </button>
        <p class="error" id="errorBox" style="display:none"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getAuth, GithubAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAC68Qs2ct4TW8i1TS_G2gNVaw9ur4Cyr0",
            authDomain: "haytool-cloud-startpage-github.firebaseapp.com",
            projectId: "haytool-cloud-startpage-github",
            storageBucket: "haytool-cloud-startpage-github.firebasestorage.app",
            messagingSenderId: "524900247283",
            appId: "1:524900247283:web:7905a99380660ec3adf986"
        };

        // Eklenti ID'sini URL parametresinden al (dinamik, hardcode değil)
        const params = new URLSearchParams(window.location.search);
        const EXTENSION_ID = params.get('extid');

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GithubAuthProvider();

        function showError(msg) {
            document.getElementById('loader').style.display = "none";
            document.getElementById('btnAuth').style.display = "inline-flex";
            document.getElementById('statusTitle').innerText = "Giriş Başarısız";
            document.getElementById('statusTitle').style.color = "#ef4444";
            document.getElementById('errorBox').innerText = msg;
            document.getElementById('errorBox').style.display = "block";
        }

        document.getElementById('btnAuth').addEventListener('click', async () => {
            document.getElementById('btnAuth').style.display = "none";
            document.getElementById('loader').style.display = "block";
            document.getElementById('statusTitle').innerText = "Giriş Bekleniyor...";
            document.getElementById('statusDesc').innerText = "GitHub onayını verin.";

            try {
                const result = await signInWithPopup(auth, provider);
                const credential = GithubAuthProvider.credentialFromResult(result);
                const token = credential.accessToken;

                document.getElementById('statusTitle').innerText = "Giriş Başarılı!";
                document.getElementById('statusTitle').style.color = "#22c55e";
                document.getElementById('statusDesc').innerText = "Eklentiye bağlanılıyor...";

                if (!EXTENSION_ID) {
                    showError("Hata: Eklenti ID alınamadı. Eklentiyi yeniden yükleyin.");
                    return;
                }

                chrome.runtime.sendMessage(EXTENSION_ID, { action: "AUTH_SUCCESS", token }, (response) => {
                    if (chrome.runtime.lastError) {
                        showError("Eklenti bağlantı hatası: " + chrome.runtime.lastError.message);
                        return;
                    }
                    document.getElementById('statusDesc').innerText = "Tamamlandı! Pencere kapanıyor...";
                    setTimeout(() => window.close(), 800);
                });

            } catch (error) {
                showError(error.message);
            }
        });
    </script>
</body>
</html>
