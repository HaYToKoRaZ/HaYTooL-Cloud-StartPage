<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glass Bubble -->
  <rect width="128" height="128" rx="28" fill="#0f172a" fill-opacity="0.9"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="url(#cloudGrad)" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Cloud Body -->
  <path d="M40 82h48a20 20 0 0 0 5-39.36A26 26 0 0 0 44.8 38.6 18 18 0 0 0 40 82z" 
        fill="url(#cloudGrad)" fill-opacity="0.25" stroke="url(#cloudGrad)" stroke-width="4" stroke-linejoin="round" />
        
  <!-- Glowing Rocket / Bolt Symbol -->
  <g filter="url(#glow)">
    <path d="M68 36c6 4 14 14 14 24l-8 4-4-4-4 8-12 16 4-10-8-2 8-14 4-18 4-4z" 
          fill="url(#rocketGrad)" />
    <circle cx="70" cy="50" r="3" fill="#0f172a" />
    <path d="M54 74l-8 16 12-6-4 8 10-12" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>